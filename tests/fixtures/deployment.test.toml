schema_version = 1

[deployment]
codex_home = "auto"
ccr_home = "auto"
backup_root = "auto"

[worker]
model_family = "deepseek_flash"
compatibility_profile = "deepseek_responses_v4"
provider_id = "fixture-provider"
model_selector = "fixture-provider/fixture-model"
effective_model_identity = "fixture-deepseek-flash"

[gateway]
local_base_url = "http://127.0.0.1:3456/v1"
client_key_env = "FIXTURE_CCR_CLIENT_KEY"
route_id = "fixture-route"

[deployment_policy]
allow_unverified_ccr = true
install_plugin = true
register_agents = true
